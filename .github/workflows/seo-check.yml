name: Storefront SEO & Metadata Integrity Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  seo-verification:
    name: Verify Sitemap, Canonicals & Social Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Storefront JavaScript Syntax
        run: node --check app.js

      - name: Run Build-Time SEO Verification
        run: node scripts/verify-seo.mjs
