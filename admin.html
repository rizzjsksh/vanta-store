<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VANTA Admin</title><link rel="stylesheet" href="styles.css"><style>
.admin-wrap{max-width:1100px;margin:50px auto;padding:24px}.admin-panel{background:#f5f3ef;color:#111;padding:28px;margin:20px 0}.admin-panel input,.admin-panel textarea,.admin-panel select{width:100%;padding:12px;margin:7px 0 15px;border:1px solid #bbb;background:white;color:#111}.admin-panel label{display:block;font-size:12px;letter-spacing:1px}.admin-panel button{background:#111;color:white;border:0;padding:13px 20px;cursor:pointer;margin:5px 5px 5px 0}.admin-products{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.admin-product{background:#f5f3ef;color:#111;padding:16px}.admin-product img{width:100%;height:180px;object-fit:cover;background:#ddd}.admin-hidden{display:none}.admin-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.admin-row{grid-template-columns:1fr}}
</style></head><body><div class="announcement">VANTA / PRIVATE ADMIN</div><header class="site-header"><a class="wordmark" href="index.html">VANTA<span>®</span></a><a class="cart-button" href="index.html">VIEW STORE ↗</a></header>
<main class="admin-wrap"><p class="eyebrow">STORE MANAGEMENT</p><h1 class="page-title">VANTA ADMIN.</h1><p id="status">Connect securely to manage your store.</p>
<section id="auth" class="admin-panel"><h2 id="auth-title">ADMIN ACCESS</h2><p id="auth-help">If this is your first time, create your admin password. Otherwise, sign in.</p><label>ADMIN PASSWORD</label><input id="password" type="password" minlength="12" autocomplete="current-password" placeholder="At least 12 characters"><button id="auth-btn">CONTINUE</button></section>
<section id="dashboard" class="admin-hidden"><div class="admin-panel"><h2>PRODUCT EDITOR</h2><form id="product-form"><div class="admin-row"><div><label>PRODUCT ID</label><input id="pid" required placeholder="e.g. tee-grey"></div><div><label>PRODUCT NAME</label><input id="pname" required></div></div><div class="admin-row"><div><label>CATEGORY</label><input id="category" value="T-SHIRT"></div><div><label>COLOUR</label><input id="colour"></div></div><div class="admin-row"><div><label>PRICE (USD)</label><input id="price" type="number" step="0.01" required></div><div><label>PRODUCT IMAGE</label><input id="image" type="file" accept="image/*"></div></div><label>DESCRIPTION</label><textarea id="description" rows="3"></textarea><div class="admin-row"><div><label>PRODUCT DETAILS (one per line)</label><textarea id="details" rows="4"></textarea></div><div><label>CARE INSTRUCTIONS (one per line)</label><textarea id="care" rows="4"></textarea></div></div><label>SIZES (one per line, format: SIZE|PRICE)</label><textarea id="sizes" rows="4" placeholder="S|39.99&#10;M|39.99&#10;L|39.99"></textarea><div class="admin-row"><label><input id="published" type="checkbox" checked> Published</label><label><input id="featured" type="checkbox"> Featured on homepage</label></div><button type="submit">SAVE PRODUCT</button><button type="button" id="new-product">NEW PRODUCT</button></form></div><h2>YOUR PRODUCTS</h2><div id="products" class="admin-products"></div><div class="admin-panel"><button id="logout">SIGN OUT</button></div></section></main>
<footer class="site-footer"><a class="wordmark" href="index.html">VANTA<span>®</span></a><p>PRIVATE STORE MANAGEMENT</p></footer>
<script>
const API="https://vanta-api.rizzify.workers.dev";let token=sessionStorage.getItem("vanta_admin_token");let setupMode=false;
const $=id=>document.getElementById(id),status=m=>$("status").textContent=m;
async function request(path,opts={}){const headers={...(opts.headers||{})};if(token)headers.Authorization="Bearer "+token;const r=await fetch(API+path,{...opts,headers});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d;}
async function start(){try{const s=await request("/api/admin/session");if(s.authenticated){$("auth").classList.add("admin-hidden");$("dashboard").classList.remove("admin-hidden");await loadProducts();return;}const h=await fetch(API+"/api/admin/session").then(r=>r.json());const setup=await fetch(API+"/api/setup",{method:"OPTIONS"});const loginCheck=await fetch(API+"/api/login",{method:"OPTIONS"});const health=await fetch(API+"/api/health").then(r=>r.json());setupMode=!!health.setupRequired;$("auth-title").textContent=setupMode?"CREATE ADMIN PASSWORD":"ADMIN SIGN IN";$("auth-help").textContent=setupMode?"Create a strong password with at least 12 characters. Keep it private.":"Enter your admin password to manage VANTA."; $("auth-btn").textContent=setupMode?"CREATE ADMIN":"SIGN IN";}catch(e){status(e.message);}}
async function authAction(){try{const password=$("password").value;if(setupMode){await request("/api/setup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password})});setupMode=false;status("Admin created. Sign in with your new password.");$("auth-title").textContent="ADMIN SIGN IN";$("auth-btn").textContent="SIGN IN";$("password").value="";return;}const d=await request("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password})});token=d.token;sessionStorage.setItem("vanta_admin_token",token);$("auth").classList.add("admin-hidden");$("dashboard").classList.remove("admin-hidden");status("Signed in.");await loadProducts();}catch(e){status(e.message);}}
function resetForm(){$("product-form").reset();$("pid").disabled=false;$("category").value="T-SHIRT";$("published").checked=true;}
function fill(p){$("pid").value=p.id;$("pid").disabled=true;$("pname").value=p.name;$("category").value=p.category;$("colour").value=p.colour;$("price").value=p.price;$("description").value=p.description;$("details").value=(p.details||[]).join("\n");$("care").value=(p.care||[]).join("\n");$("sizes").value=(p.sizes||[]).map(x=>x.size+"|"+x.price).join("\n");$("published").checked=p.published;$("featured").checked=p.featured;window.currentImageKey=p.image_key||"";window.scrollTo({top:0,behavior:"smooth"});}
async function loadProducts(){const d=await request("/api/admin/products");$("products").innerHTML=d.products.map(p=>'<article class="admin-product">'+(p.image?'<img src="'+API+p.image+'">':'<div style="height:180px;background:#ddd;display:grid;place-items:center">NO IMAGE</div>')+'<h3>'+p.name+'</h3><p>'+p.colour+' · $'+Number(p.price).toFixed(2)+'</p><button data-edit="'+p.id+'">EDIT</button><button data-delete="'+p.id+'">DELETE</button></article>').join("");$("products").querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>fill(d.products.find(p=>p.id===b.dataset.edit)));$("products").querySelectorAll("[data-delete]").forEach(b=>b.onclick=async()=>{if(confirm("Delete this product?")){await request("/api/admin/products/"+encodeURIComponent(b.dataset.delete),{method:"DELETE"});await loadProducts();}});}
$("product-form").onsubmit=async e=>{e.preventDefault();try{let imageKey=window.currentImageKey||null;const file=$("image").files[0];if(file){const f=new FormData();f.append("file",file);const up=await request("/api/admin/upload",{method:"POST",body:f});imageKey=up.key;}const sizes=$("sizes").value.split("\n").filter(Boolean).map(line=>{const a=line.split("|");return {size:a[0].trim(),price:Number(a[1]||$("price").value)}});const data={id:$("pid").value.trim(),name:$("pname").value.trim(),category:$("category").value,colour:$("colour").value,price:Number($("price").value),description:$("description").value,details:$("details").value.split("\n").filter(Boolean),care:$("care").value.split("\n").filter(Boolean),sizes,image_key:imageKey,published:$("published").checked,featured:$("featured").checked};await request("/api/admin/products",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});status("Product saved.");resetForm();window.currentImageKey="";await loadProducts();}catch(e){status(e.message);}};
$("auth-btn").onclick=authAction;$("new-product").onclick=resetForm;$("logout").onclick=async()=>{try{await request("/api/logout",{method:"POST"});}catch{}sessionStorage.removeItem("vanta_admin_token");token=null;location.reload();};start();
</script></body></html>
