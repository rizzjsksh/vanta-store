<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Explore VANTA Essentials minimalist streetwear T-shirts. Discover the VANTA Signature Tee in black and white.">
  <title>VANTA T-Shirts | VANTA Essentials</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="announcement">VANTA ESSENTIALS — FIRST COLLECTION</div>
  <header class="site-header">
    <a class="wordmark" href="index.html">VANTA<span>®</span></a>
    <nav class="desktop-nav" aria-label="Main navigation"><a href="shop.html">SHOP</a><a href="about.html">OUR STORY</a><a href="contact.html">CONTACT</a></nav>
    <a class="cart-button" href="cart.html">BAG <span id="cart-count">0</span></a>
  </header>
  <main class="page-main">
    <p class="eyebrow">VANTA / ESSENTIALS 001</p>
    <div id="product-detail" class="product-detail-layout">
      <div id="detail-visual" class="product-visual detail-visual"></div>
      <div class="detail-copy">
        <h1 class="page-title" id="detail-name">VANTA T-Shirt</h1>
        <p id="detail-type" class="page-lead"></p>
        <p id="detail-description" class="product-description"></p>
        <div class="detail-price" id="detail-price">$39.99</div>
        
        <label class="variant-label" for="detail-size">SELECT SIZE</label>
        <select id="detail-size" class="size-select" aria-label="Select size"></select>
        
        <label class="variant-label" for="detail-qty" style="margin-top:16px">QUANTITY</label>
        <div class="quantity-control">
          <button type="button" class="quantity-btn" id="qty-minus" aria-label="Decrease quantity">–</button>
          <input type="text" id="detail-qty" class="quantity-input" value="1" readonly>
          <button type="button" class="quantity-btn" id="qty-plus" aria-label="Increase quantity">+</button>
        </div>

        <div class="add-to-bag-row">
          <button type="button" id="add-to-bag" class="button button-dark add-to-bag-btn">ADD TO BAG</button>
          <a class="button button-light" href="cart.html" style="padding:16px 28px;font-size:11px;letter-spacing:.15em">VIEW BAG</a>
        </div>

        <p class="size-note" id="detail-size-note"></p>
        
        <h2 class="detail-subheading">PRODUCT DETAILS</h2>
        <ul id="detail-features" class="detail-list"></ul>
        <h2 class="detail-subheading">CARE INSTRUCTIONS</h2>
        <ul id="detail-care" class="detail-list"></ul>
        <a class="button button-dark" href="shop.html" style="margin-top:25px;display:inline-block">← BACK TO SHOP</a>
      </div>
    </div>
  </main>
  <footer class="site-footer"><a class="wordmark" href="index.html">VANTA<span>®</span></a><p>THE ART OF STANDING APART.</p><span>© VANTA. ALL RIGHTS RESERVED.</span></footer>
  <script src="app.js"></script>
</body>
</html>
